services:
  dev:
    build: .
    working_dir: /src
    volumes:
      - .:/src
      - node_modules:/src/node_modules
    ports:
      - "8080:8080"
    command: sh -c "pnpm install && pnpm dev"

  install:
    build: .
    working_dir: /src
    volumes:
      - .:/src
      - node_modules:/src/node_modules
    entrypoint: sh -c "if [ $$# -eq 0 ]; then pnpm install; else pnpm add $$*; fi" --

  build:
    build: .
    working_dir: /src
    volumes:
      - .:/src
      - node_modules:/src/node_modules
    command: sh -c "pnpm install && pnpm build"

volumes:
  node_modules:
